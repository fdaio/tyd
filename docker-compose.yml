# tyd Control Panel (pairing + WebSocket /relay). Optional standalone relay.
# TLS is expected at the edge (e.g. Cloudflare).
#
# Config (optional .env next to this file — Compose loads it automatically):
#   TYD_CP_BASE_URL=https://app.getfda.dev
#   TYD_CP_PORT=8080
#   TYD_RELAY_PORT=9090
#
# Fast deploy (compile on a machine with Go, Docker only COPY — no golang image):
#   make dist && cp dist/tyd-*.tar.gz releases/
#   make docker-prep && docker compose up -d --build
#
# Slow path (compile inside Docker; needs RAM/swap on 1C/1G):
#   make docker-source
#
# Standalone relay (usually unnecessary — CP already serves /relay):
#   make docker-prep && docker compose --profile standalone-relay up -d --build
#
# Local smoke:
#   curl -s http://127.0.0.1:8080/healthz
#   tyd --platform http://127.0.0.1:8080 --relay http://127.0.0.1:8080/relay register
#
# WARNING: CP pairing state is in-memory — container restart loses registrations,
# invites, and peer pairs. Relay holds no durable session state.

services:
  controlpanel:
    build:
      context: .
      dockerfile: Dockerfile.controlpanel
      # Default stage `runtime` expects bin/controlpanel from `make docker-prep`.
      target: runtime
    image: tyd-controlpanel:local
    ports:
      - "${TYD_CP_PORT:-8080}:8080"
    environment:
      TYD_CP_BASE_URL: ${TYD_CP_BASE_URL:-https://app.getfda.dev}
      TYD_CP_RELEASE_DIR: /releases
      GOMAXPROCS: "1"
    volumes:
      # Host dir with tyd-linux.tar.gz / tyd-darwin.tar.gz / tyd-freebsd.tar.gz
      - ${TYD_CP_RELEASE_HOST_DIR:-./releases}:/releases:ro
    # Soft caps for a 1C/1G box (Compose / non-Swarm).
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped

  # Optional dedicated WebSocket relay. Default clients use CP /relay.
  relay:
    profiles: ["standalone-relay"]
    build:
      context: .
      dockerfile: Dockerfile.relay
      target: runtime
    image: tyd-relay:local
    ports:
      - "${TYD_RELAY_PORT:-9090}:9090"
    environment:
      GOMAXPROCS: "1"
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
