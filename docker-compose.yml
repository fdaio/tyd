# tyd Control Panel (pairing only). TLS is expected at the edge (e.g. Cloudflare).
#
# Config (optional .env next to this file — Compose loads it automatically):
#   TYD_CP_BASE_URL=https://app.getfda.dev
#   TYD_CP_PORT=8080
#
# Put release archives next to compose (see releases/):
#   make dist && cp dist/tyd-*.tar.gz releases/
#
# Local smoke:
#   docker compose up -d --build
#   curl -s http://127.0.0.1:8080/healthz
#   curl -fsSL http://127.0.0.1:8080/install.sh | sh -s -- --agent --platform http://127.0.0.1:8080
#   tyd --platform http://127.0.0.1:8080 register
#
# Production: set TYD_CP_BASE_URL to the public HTTPS origin (default below).
# Clients default to that same host — use: tyd register
#
# 1C/1G: runtime caps below keep the process small. First `docker compose build`
# still needs headroom (or ~1G swap) because the Go toolchain is heavy.
#
# WARNING: pairing state is in-memory — container restart loses registrations,
# invites, and peer pairs.

services:
  controlpanel:
    build:
      context: .
      dockerfile: Dockerfile.controlpanel
    image: tyd-controlpanel:local
    ports:
      - "${TYD_CP_PORT:-8080}:8080"
    environment:
      TYD_CP_BASE_URL: ${TYD_CP_BASE_URL:-https://app.getfda.dev}
      TYD_CP_RELEASE_DIR: /releases
      GOMAXPROCS: "1"
    volumes:
      # Host dir with tyd-linux.tar.gz / tyd-darwin.tar.gz / tyd-freebsd.tar.gz
      - ${TYD_CP_RELEASE_HOST_DIR:-./releases}:/releases:ro
    # Soft caps for a 1C/1G box (Compose / non-Swarm).
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped

  # Blind dual-NAT rendezvous (TTY bytes are end-to-end encrypted by tyd).
  # Put TLS at the edge; point clients/servers at https://relay.getfda.dev
  # via --relay (default) or TYD_RELAY.
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: tyd-relay:local
    ports:
      - "${TYD_RELAY_PORT:-9090}:9090"
    environment:
      GOMAXPROCS: "1"
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
