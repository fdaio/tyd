name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: test (linux)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Persistent self-hosted home already has a module cache; restoring
          # Actions caches into it races with tar ("file exists").
          cache: false

      - name: Download modules
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i); retrying..."
            sleep $((i * 5))
          done
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o tyd .

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    # Private-repo macOS minutes are currently blocked by billing; don't block
    # the self-hosted Linux pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # macos runners occasionally fail DNS/proxy to proxy.golang.org on first fetch
      - name: Download modules
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i); retrying..."
            sleep $((i * 5))
          done
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o tyd .

  dist:
    needs: [test-linux]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Package linux, darwin, and freebsd releases
        # Parallel cross-compile (self-hosted image may not have `make`).
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist/linux dist/darwin dist/freebsd
          build() {
            local os="$1" arch="$2"
            echo "==> $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/$os/tyd-$arch" .
          }
          pids=
          for os in linux darwin freebsd; do
            for arch in amd64 arm64; do
              build "$os" "$arch" &
              pids="$pids $!"
            done
          done
          for p in $pids; do wait "$p"; done
          for os in linux darwin freebsd; do
            tar -C dist -czf "dist/tyd-$os.tar.gz" "$os"
          done
          ls -lh dist

      - name: Upload linux release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tyd-linux
          path: dist/tyd-linux.tar.gz

      - name: Upload darwin release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tyd-darwin
          path: dist/tyd-darwin.tar.gz

      - name: Upload freebsd release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tyd-freebsd
          path: dist/tyd-freebsd.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
