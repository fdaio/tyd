# Daily release. Version is <YYYY.MM.DD>-<short sha> in Asia/Shanghai.
# 15:00 UTC is 23:00 in Shanghai, so the date matches that calendar day.
# No new commit since the last daily tag: the plan job succeeds and the rest skip.
#
# What a daily build produces is a prerelease, not what installs fetch. Every
# merge to main would otherwise become, minutes later, the version every new
# install gets -- and this daemon survives logout, starts at boot and hands out
# remote shells, so a bad build is not a bad CLI. Promotion is deliberate:
# see .github/workflows/promote.yml.
name: Release

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: tyd-daily-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide
        id: plan
        run: sh scripts/release-plan.sh

  test:
    name: test (linux)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i); retrying..."
            sleep $((i * 5))
          done
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  dist:
    name: dist
    needs: [plan, test]
    if: needs.plan.outputs.publish == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package linux, darwin, and freebsd releases
        # One archive per os+arch: install.sh pulls a single file, so a shared
        # per-OS tarball made every install download the other architecture and
        # the relay for nothing (12.4MB per install versus 3.7MB now).
        run: |
          set -eux
          rm -rf dist
          build() {
            local os="$1" arch="$2"
            echo "==> $os/$arch"
            mkdir -p "dist/$os-$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/$os-$arch/tyd" ./cmd/tyd
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/$os-$arch/tyd-relay" ./cmd/relay
          }
          pids=
          for os in linux darwin freebsd; do
            for arch in amd64 arm64; do
              build "$os" "$arch" &
              pids="$pids $!"
            done
          done
          for p in $pids; do wait "$p"; done
          for os in linux darwin freebsd; do
            for arch in amd64 arm64; do
              tar -C "dist/$os-$arch" -czf "dist/tyd-$os-$arch.tar.gz" tyd
              # The relay is a fleet component; install.sh never installs it.
              tar -C "dist/$os-$arch" -czf "dist/tyd-relay-$os-$arch.tar.gz" tyd-relay
            done
          done
          ls -lh dist

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: tyd-${{ needs.plan.outputs.version }}
          path: dist/tyd-*.tar.gz

  publish:
    name: publish
    needs: [plan, dist]
    if: needs.plan.outputs.publish == 'true' && needs.dist.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Release notes
        run: |
          set -eu
          {
            echo "Version \`${{ needs.plan.outputs.version }}\`"
            echo
            echo "Commit \`${{ needs.plan.outputs.sha }}\`"
            echo
            echo "## Changes"
            prev=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' \
              'refs/tags/[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-*' | head -1 || true)
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' "${prev}..HEAD"
            else
              git log -n 20 --pretty=format:'- %s (%h)'
            fi
            echo
          } > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          name: tyd-${{ needs.plan.outputs.version }}
          path: artifacts

      # A build off main is a prerelease. GitHub's "latest release" excludes
      # prereleases, and install.sh downloads from that, so a merge does not
      # become what new installs get: .github/workflows/promote.yml runs the smoke
      # test and promotes a build once it is verified. `tyd --channel edge` is how
      # to ask for the newest build before then.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: ${{ needs.plan.outputs.version }}
          body_path: release-notes.md
          files: artifacts/*.tar.gz
          prerelease: true
          make_latest: false
