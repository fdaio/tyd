# Daily release. Version is <YYYY.MM.DD>-<short sha> in Asia/Shanghai.
# 15:00 UTC is 23:00 in Shanghai, so the date matches that calendar day.
# No new commit since the last daily tag: the plan job succeeds and the rest skip.
name: Release

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: tyd-daily-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide
        id: plan
        run: sh scripts/release-plan.sh

  test:
    name: test (linux)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i); retrying..."
            sleep $((i * 5))
          done
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  dist:
    name: dist
    needs: [plan, test]
    if: needs.plan.outputs.publish == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package linux, darwin, and freebsd releases
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist/linux dist/darwin dist/freebsd
          build() {
            local os="$1" arch="$2"
            echo "==> $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/$os/tyd-$arch" ./cmd/tyd
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/$os/tyd-relay-$arch" ./cmd/relay
          }
          pids=
          for os in linux darwin freebsd; do
            for arch in amd64 arm64; do
              build "$os" "$arch" &
              pids="$pids $!"
            done
          done
          for p in $pids; do wait "$p"; done
          for os in linux darwin freebsd; do
            tar -C dist -czf "dist/tyd-$os.tar.gz" "$os"
          done
          ls -lh dist

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: tyd-${{ needs.plan.outputs.version }}
          path: dist/tyd-*.tar.gz

  publish:
    name: publish
    needs: [plan, dist]
    if: needs.plan.outputs.publish == 'true' && needs.dist.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Release notes
        run: |
          set -eu
          {
            echo "Version \`${{ needs.plan.outputs.version }}\`"
            echo
            echo "Commit \`${{ needs.plan.outputs.sha }}\`"
            echo
            echo "## Changes"
            prev=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' \
              'refs/tags/[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-*' | head -1 || true)
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' "${prev}..HEAD"
            else
              git log -n 20 --pretty=format:'- %s (%h)'
            fi
            echo
          } > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          name: tyd-${{ needs.plan.outputs.version }}
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: ${{ needs.plan.outputs.version }}
          body_path: release-notes.md
          files: artifacts/*.tar.gz
          make_latest: true
